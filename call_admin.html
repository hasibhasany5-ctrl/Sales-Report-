<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Admin | CAR ZEO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #050810; font-family: 'Plus Jakarta Sans', sans-serif; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Word File Table Style */
        #printArea { background: white; color: black; display: none; width: 1050px; margin: 0 auto; padding: 40px; }
        .category-block { page-break-after: always; margin-bottom: 40px; } /* প্রতিটি খাতের পর নতুন পেজ */
        .category-block:last-child { page-break-after: auto; }
        
        .report-table { width: 100%; border-collapse: collapse; border: 1.5px solid black; margin-top: 10px; }
        .report-table th { background: #f3f4f6 !important; border: 1.5px solid black; padding: 6px; font-size: 10px; text-transform: uppercase; }
        .report-table td { border: 1.5px solid black; padding: 6px 10px; font-size: 11px; font-weight: 700; color: black; }
        
        .total-box { border: 2px solid black; padding: 10px; margin-top: 20px; font-weight: 900; text-align: center; font-size: 18px; }

        @media print {
            .no-print { display: none !important; }
            #printArea { display: block !important; border: none; width: 100%; margin: 0; padding: 0; }
            body { background: white; }
            @page { size: portrait; margin: 0.5cm; }
        }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-7xl mx-auto no-print">
        <header class="flex justify-between items-center mb-8 glass p-6 rounded-3xl">
            <div class="flex items-center gap-4">
                <img src="https://i.ibb.co.com/MymLgRJG/hasib.jpg" class="h-14 rounded-xl">
                <h1 class="text-2xl font-black">Admin Expense Hub</h1>
            </div>
            <div class="flex gap-4 items-center">
                <input type="month" id="filterMonth" onchange="loadData()" class="bg-white/5 border border-white/10 p-2 rounded-xl text-white text-sm outline-none">
                <button onclick="window.print()" class="bg-red-600 px-6 py-2 rounded-xl text-xs font-black uppercase"><i class="fas fa-print mr-2"></i>Export Final Report</button>
            </div>
        </header>

        <div class="glass p-8 rounded-[35px]">
            <table class="w-full text-left text-sm">
                <thead><tr class="text-slate-500 border-b border-white/10">
                    <th class="p-4">Date</th><th class="p-4">Category</th><th class="p-4">Description</th><th class="p-4">Taka</th><th class="p-4 text-center">Action</th>
                </tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- Print Report Section -->
    <div id="printArea">
        <!-- JS will dynamically inject tables here -->
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBrz1xvq4Fpt9-j75-gUS4d8ebqPRLmOK0", 
            databaseURL: "https://sales-report-nugortech-it-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('filterMonth').value = new Date().toISOString().slice(0, 7);
        const categories = ["Transport", "Office Maintenance", "Snacks", "Courier", "Other"];

        function loadData() {
            const filter = document.getElementById('filterMonth').value;
            const tbody = document.getElementById('tbody');
            const printArea = document.getElementById('printArea');
            tbody.innerHTML = ""; printArea.innerHTML = "";

            db.ref('car_zeo_expenses').once('value', snap => {
                const data = snap.val();
                let grandTotal = 0;
                let categoryData = {};
                categories.forEach(c => categoryData[c] = []);

                if(data) {
                    Object.keys(data).forEach(k => {
                        const d = data[k];
                        if(d.date.startsWith(filter)) {
                            // Dashboard List
                            tbody.innerHTML += `<tr class="border-b border-white/5">
                                <td class="p-4 opacity-70">${d.date}</td>
                                <td class="p-4 text-blue-400 font-bold">${d.cat}</td>
                                <td class="p-4">${d.desc}</td>
                                <td class="p-4 text-red-500 font-black">${d.taka.toLocaleString()}</td>
                                <td class="p-4 text-center"><button onclick="deleteExp('${k}')" class="text-slate-700 hover:text-red-500"><i class="fas fa-trash"></i></button></td>
                            </tr>`;
                            // Group for Printing
                            if(categoryData[d.cat]) categoryData[d.cat].push(d);
                            grandTotal += d.taka;
                        }
                    });
                }

                // Generate Individual Category Tables for Printing
                let printHtml = "";
                categories.forEach(catName => {
                    const items = categoryData[catName];
                    if(items.length > 0) {
                        let subTotal = 0;
                        printHtml += `
                        <div class="category-block">
                            <div class="flex items-center justify-between border-b-2 border-black pb-2 mb-4">
                                <img src="https://i.ibb.co.com/MymLgRJG/hasib.jpg" height="60" style="height: 60px">
                                <div class="text-center">
                                    <h1 class="text-3xl font-black">CAR ZEO</h1>
                                    <p class="text-[9px] font-bold">EXPENDITURE REPORT: ${catName.toUpperCase()}</p>
                                </div>
                                <div style="width: 60px"></div>
                            </div>
                            <table class="report-table">
                                <thead><tr><th width="10%">SL</th><th width="15%">Date</th><th width="55%">Description</th><th width="20%">Taka</th></tr></thead>
                                <tbody>
                                    ${items.map((it, idx) => {
                                        subTotal += it.taka;
                                        return `<tr><td align="center">${idx+1}</td><td align="center">${it.date}</td><td>${it.desc}</td><td align="center"><strong>${it.taka.toLocaleString()}</strong></td></tr>`;
                                    }).join('')}
                                </tbody>
                                <tfoot><tr style="background:#f2f2f2; font-weight:800"><td colspan="3" align="right" style="padding-right:15px">TOTAL ${catName.toUpperCase()}:</td><td align="center">${subTotal.toLocaleString()}</td></tr></tfoot>
                            </table>
                            <div class="flex justify-between mt-10">
                                <div class="border-t border-black w-32 text-center text-[9px] pt-1">Prepared By</div>
                                <div class="border-t border-black w-32 text-center text-[9px] pt-1">Checked By</div>
                            </div>
                        </div>`;
                    }
                });

                // Final Grand Total Page
                if(grandTotal > 0) {
                    printHtml += `
                    <div class="category-block text-center flex flex-col justify-center h-full">
                        <img src="https://i.ibb.co.com/MymLgRJG/hasib.jpg" height="80" style="height: 80px; margin: 0 auto">
                        <h1 class="text-4xl font-black mt-4">CAR ZEO</h1>
                        <h2 class="text-xl underline font-bold mt-10">MONTHLY CONSOLIDATED SUMMARY</h2>
                        <p class="mt-2 font-bold">Month: ${filter}</p>
                        <div class="total-box mx-auto w-3/4 mt-20">
                            GRAND TOTAL EXPENDITURE: ${grandTotal.toLocaleString()} BDT
                        </div>
                        <div class="flex justify-around mt-40">
                            <div class="border-t border-black w-48 text-center pt-2 font-bold uppercase text-xs">Director Signature</div>
                            <div class="border-t border-black w-48 text-center pt-2 font-bold uppercase text-xs">Managing Partner</div>
                        </div>
                    </div>`;
                }

                printArea.innerHTML = printHtml;
            });
        }

        function deleteExp(key) { if(confirm("Delete?")) db.ref('car_zeo_expenses/' + key).remove().then(() => loadData()); }
        loadData();
    </script>
</body>
</html>
