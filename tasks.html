<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Calendar | Nugortech IT Ltd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050810; color: white; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        input, select, textarea { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; font-size: 13px !important; padding: 12px !important; border-radius: 12px !important; width: 100%; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #00A3FF !important; }
    </style>
</head>
<body class="flex min-h-screen overflow-x-hidden">

    <!-- Sidebar -->
    <div class="w-[280px] bg-black/40 backdrop-blur-3xl border-r border-white/5 p-8 fixed h-full z-50">
        <div class="text-center mb-10">
            <h2 class="text-2xl font-black tracking-tighter">NUGORTECH <span class="text-blue-500">IT</span></h2>
            <p class="text-[9px] text-orange-500 font-bold uppercase tracking-[3px] mt-1">Content Strategy Hub</p>
        </div>
        <div class="space-y-4">
            <div class="p-4 rounded-2xl bg-blue-600/10 border border-blue-500/20 text-blue-400 text-center font-bold text-xs uppercase tracking-widest">
                <i class="fas fa-calendar-alt mr-2"></i> Content Calendar
            </div>
            <a href="home.html" class="block p-4 rounded-2xl hover:bg-white/5 text-slate-500 hover:text-white transition-all text-xs font-bold uppercase">
                <i class="fas fa-home mr-2"></i> Master Hub
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="ml-[280px] w-full p-8 lg:p-12">
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="glass p-6 rounded-[30px] text-center border-b-4 border-blue-500">
                <span class="text-3xl font-black block" id="statTotal">0</span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Total Plans</span>
            </div>
            <div class="glass p-6 rounded-[30px] text-center border-b-4 border-orange-500">
                <span class="text-3xl font-black block text-orange-500" id="statPending">0</span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">In Progress</span>
            </div>
            <div class="glass p-6 rounded-[30px] text-center border-b-4 border-emerald-500">
                <span class="text-3xl font-black block text-emerald-500" id="statDone">0</span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Published</span>
            </div>
            <div class="glass p-6 rounded-[30px] text-center border-b-4 border-purple-500">
                <span class="text-3xl font-black block text-purple-500" id="statToday">0</span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Today's Goal</span>
            </div>
        </div>

        <!-- Planning Form -->
        <div class="glass p-8 rounded-[40px] mb-10">
            <h3 class="text-lg font-extrabold text-blue-400 mb-6 flex items-center gap-3">
                <i class="fas fa-plus-circle"></i> Create New Content Plan
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Publish Date</label>
                    <input type="date" id="pubDate">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Content Type</label>
                    <select id="cType">
                        <option value="Images">Images</option>
                        <option value="Video/Reels">Video / Reels</option>
                        <option value="Carousel">Carousel</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Assign To</label>
                    <select id="assignTo">
                        <option value="Emon">MD: EMON</option>
                        <option value="Hasan Ali">MD: HASAN ALI</option>
                        <option value="Nur Islam">MD: NUR ISLAM</option>
                        <option value="Shakhayat">MD: SHAKHAYAT</option>
                        <option value="Hasib">MD: AL HASIB</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Status</label>
                    <select id="cStatus">
                        <option value="Pending">Pending</option>
                        <option value="Working">Working</option>
                        <option value="Complited">Complited</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Content Idea / Ref Link</label>
                    <input type="text" id="cIdea" placeholder="Idea summary or link">
                </div>
                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Purpose</label>
                    <input type="text" id="cPurpose" placeholder="e.g. Service Promotion">
                </div>
                <div class="md:col-span-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <textarea id="cScript" rows="3" placeholder="Script..."></textarea>
                    <textarea id="cAdCopy" rows="3" placeholder="AD Copy..."></textarea>
                    <textarea id="cCaption" rows="3" placeholder="Caption..."></textarea>
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="savePlan()" class="bg-gradient-to-r from-blue-600 to-blue-400 px-10 py-4 rounded-2xl font-black uppercase text-sm shadow-xl hover:scale-[1.03] transition-all">
                    Publish to Calendar
                </button>
            </div>
        </div>

        <!-- Master List Board -->
        <div class="glass p-8 rounded-[40px]">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-black">Calendar Timeline</h3>
                <div class="flex gap-4">
                    <input type="text" id="src" onkeyup="filter()" placeholder="Search staff..." class="w-64">
                    <button onclick="wipe()" class="text-red-500 text-[10px] font-bold uppercase hover:underline">Clear (8087)</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left min-w-[1000px]">
                    <thead>
                        <tr class="text-[10px] text-slate-500 uppercase border-b border-white/5">
                            <th class="p-4">Date</th><th class="p-4">Staff</th><th class="p-4">Idea</th><th class="p-4">Copy/Caption</th><th class="p-4">Status</th><th class="p-4">Del</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBrz1xvq4Fpt9-j75-gUS4d8ebqPRLmOK0", databaseURL: "https://sales-report-nugortech-it-default-rtdb.firebaseio.com", projectId: "sales-report-nugortech-it", appId: "1:848643315031:web:e6fbf92153490ea9d31a12" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function savePlan() {
            const pubDate = document.getElementById('pubDate').value;
            if(!pubDate) return alert("Please select a Publish Date!");

            const data = {
                pubDate,
                type: document.getElementById('cType').value,
                assign: document.getElementById('assignTo').value,
                status: document.getElementById('cStatus').value,
                idea: document.getElementById('cIdea').value || "No Idea Provided",
                purpose: document.getElementById('cPurpose').value || "General",
                script: document.getElementById('cScript').value || "",
                adCopy: document.getElementById('cAdCopy').value || "",
                caption: document.getElementById('cCaption').value || ""
            };

            db.ref('content_calendar').push(data).then(() => {
                alert("Saved!");
                location.reload();
            });
        }

        db.ref('content_calendar').on('value', snap => {
            const tbody = document.getElementById('tbody'); tbody.innerHTML = "";
            const all = snap.val();
            let total=0, pend=0, done=0, today=0;
            const todayStr = new Date().toISOString().split('T')[0];

            if(all) {
                Object.keys(all).reverse().forEach(k => {
                    const d = all[k];
                    total++;
                    if(d.status === "Complited") done++; else pend++;
                    if(d.pubDate === todayStr) today++;

                    tbody.innerHTML += `
                        <tr class="border-b border-white/5 hover:bg-white/5 transition-all">
                            <td class="p-4 text-blue-400 font-bold">${d.pubDate}</td>
                            <td class="p-4 text-orange-500 font-black">${d.assign}</td>
                            <td class="p-4"><b>${d.idea}</b><br><small class="opacity-50">${d.purpose}</small></td>
                            <td class="p-4 text-xs opacity-70">Copy: ${d.adCopy.substring(0,20)}...</td>
                            <td class="p-4">
                                <select onchange="updateStatus('${k}', this.value)" class="p-1 rounded bg-slate-800 text-[10px] font-bold">
                                    <option value="Pending" ${d.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Working" ${d.status === 'Working' ? 'selected' : ''}>Working</option>
                                    <option value="Complited" ${d.status === 'Complited' ? 'selected' : ''}>Complited</option>
                                </select>
                            </td>
                            <td class="p-4 text-center"><button onclick="del('${k}')" style="color:red">×</button></td>
                        </tr>
                    `;
                });
            }
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statPending').innerText = pend;
            document.getElementById('statDone').innerText = done;
            document.getElementById('statToday').innerText = today;
        });

        function updateStatus(k, s) { db.ref('content_calendar/'+k).update({ status: s }); }
        function del(k) { if(prompt("Pass?") === "8087") db.ref('content_calendar/'+k).remove(); }
        function wipe() { if(prompt("Pass?") === "8087") db.ref('content_calendar').remove(); }
        function filter() {
            const v = document.getElementById('src').value.toUpperCase();
            const rows = document.getElementById('tbody').getElementsByTagName('tr');
            for(let r of rows) { r.style.display = r.innerText.toUpperCase().includes(v) ? "" : "none"; }
        }
    </script>
</body>
</html>
